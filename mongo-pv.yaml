apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongo-pv
spec:
  capacity:
    storage: 1Gi  # Adjust the size based on your needs
  accessModes:
    - ReadWriteOnce  # Only one node can mount the volume in read-write mode
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/mnt/data/mongo"  # Local storage path (useful for Minikube or single-node clusters)
